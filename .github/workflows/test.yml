name: Test

# 테스트는 여기서만 돌린다. 배포 워크플로는 bootJar 만 만들고 바로 올린다.
# "main 에 머지됐다 = 이 워크플로를 통과했다" 가 되도록 브랜치 보호 규칙에서
# 이 체크를 필수로 걸어두면 좋다.
#   Settings → Branches → Add rule → Require status checks to pass

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Gradle 프로젝트가 backend/ 아래에 있다.
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.11'
          cache: gradle

      - name: Test
        # PlaceSchemaIntegrationTests 가 Testcontainers 로 Redis·PostGIS 를 띄운다.
        # GitHub 러너에는 Docker 가 있어 그대로 동작하지만, 이미지 pull 때문에
        # 몇 분 걸리고 드물게 실패한다. 그래서 배포 경로에서 분리했다.
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon

      - name: Upload test report
        # 실패했을 때 왜 깨졌는지 보려면 리포트가 필요하다.
        # path 는 워크스페이스 루트 기준이라 backend/ 를 붙인다.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/build/reports/tests/test
          retention-days: 7
